name: Build and Package

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Package
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build SumatraPDF
        env:
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_ACCESS: ${{ secrets.R2_ACCESS }}
          BB_SECRET: ${{ secrets.BB_SECRET }}
          BB_ACCESS: ${{ secrets.BB_ACCESS }}
        run: bun .\cmd\build.ts -release
        shell: pwsh

      - name: Determine output directory
        id: outdir
        run: echo "out_dir=out\rel64" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: List build output
        run: |
          Get-ChildItem -Path "${{ steps.outdir.outputs.out_dir }}" -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Create ZIP package
        id: package
        run: |
          $outDir = "${{ steps.outdir.outputs.out_dir }}"
          $zipName = "SumatraPDF-release-x64-$(Get-Date -Format 'yyyyMMdd-HHmmss').zip"

          if (-not (Test-Path $outDir)) {
            Write-Error "Output directory does not exist: $outDir"
            exit 1
          }

          $files = Get-ChildItem -Path $outDir -File
          if ($files.Count -eq 0) {
            Write-Error "Output directory is empty: $outDir"
            exit 1
          }

          Write-Host "Files to package:"
          $files | ForEach-Object { Write-Host "  - $($_.Name)" }

          Compress-Archive -Path "$outDir\*" -DestinationPath "$zipName" -Force

          Write-Host "Created package: $zipName"
          Write-Host "Package size: $((Get-Item $zipName).Length / 1MB) MB"

          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-release-x64
          path: "*.zip"
          retention-days: 14
          if-no-files-found: error

      - name: Print build summary
        run: |
          Write-Host "=== Build Summary ==="
          Write-Host "Build Type: release"
          Write-Host "Platform: x64"
          Write-Host "Output Directory: out\rel64"
          Write-Host "Package Name: ${{ steps.package.outputs.zip_name }}"
          Write-Host "====================="
        shell: pwsh
