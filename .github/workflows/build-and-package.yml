name: Build and Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      platform:
        description: 'Target platform'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - Win32
          - ARM64

jobs:
  build:
    name: Build and Package
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build SumatraPDF
        env:
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_ACCESS: ${{ secrets.R2_ACCESS }}
          BB_SECRET: ${{ secrets.BB_SECRET }}
          BB_ACCESS: ${{ secrets.BB_ACCESS }}
        run: |
          if "${{ github.event.inputs.build_type }}" -eq "debug" {
            bun .\cmd\build.ts -debug
          } else {
            bun .\cmd\build.ts -release
          }
        shell: pwsh

      - name: Determine output directory
        id: outdir
        run: |
          if "${{ github.event.inputs.platform }}" -eq "Win32" {
            echo "out_dir=out\rel32" >> $env:GITHUB_OUTPUT
          } elseif "${{ github.event.inputs.platform }}" -eq "ARM64" {
            echo "out_dir=out\arm64" >> $env:GITHUB_OUTPUT
          } else {
            if "${{ github.event.inputs.build_type }}" -eq "debug" {
              echo "out_dir=out\dbg64" >> $env:GITHUB_OUTPUT
            } else {
              echo "out_dir=out\rel64" >> $env:GITHUB_OUTPUT
            }
          }
        shell: pwsh

      - name: List build output
        run: |
          Get-ChildItem -Path "${{ steps.outdir.outputs.out_dir }}" -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Create ZIP package
        run: |
          $outDir = "${{ steps.outdir.outputs.out_dir }}"
          $zipName = "SumatraPDF-${{ github.event.inputs.build_type }}-${{ github.event.inputs.platform }}-$(Get-Date -Format 'yyyyMMdd-HHmmss').zip"
          
          # Verify output directory exists and has files
          if (-not (Test-Path $outDir)) {
            Write-Error "Output directory does not exist: $outDir"
            exit 1
          }
          
          $files = Get-ChildItem -Path $outDir -File
          if ($files.Count -eq 0) {
            Write-Error "Output directory is empty: $outDir"
            exit 1
          }
          
          Write-Host "Files to package:"
          $files | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # Create ZIP file with all contents from output directory
          Compress-Archive -Path "$outDir\*" -DestinationPath "$zipName" -Force
          
          Write-Host "Created package: $zipName"
          Write-Host "Package size: $((Get-Item $zipName).Length / 1MB) MB"
        id: package
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-${{ github.event.inputs.build_type }}-${{ github.event.inputs.platform }}
          path: "*.zip"
          retention-days: 14
          if-no-files-found: error

      - name: Print build summary
        run: |
          Write-Host "=== Build Summary ==="
          Write-Host "Build Type: ${{ github.event.inputs.build_type }}"
          Write-Host "Platform: ${{ github.event.inputs.platform }}"
          Write-Host "Output Directory: ${{ steps.outdir.outputs.out_dir }}"
          Write-Host "Package Name: ${{ steps.package.outputs.zip_name }}"
          Write-Host "====================="
        shell: pwsh
